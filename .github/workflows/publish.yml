name: Reusable package release

on:
  workflow_call:
    inputs:
      package_path:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      package_path: ${{ steps.target.outputs.package_path }}
      component: ${{ steps.target.outputs.component }}
      bootstrap: ${{ steps.target.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v6.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: git fetch origin main
      - name: Validate tagged publication
        if: '!inputs.dry_run'
        run: node scripts/release.ts
        id: target
        env:
          EXPECTED_PACKAGE_PATH: ${{ inputs.package_path }}
          NPM_BOOTSTRAP_ENABLED: ${{ vars.NPM_BOOTSTRAP_ENABLED }}
      - name: Validate main preview without publishing
        if: inputs.dry_run
        run: node scripts/preview-release.ts
        env:
          EXPECTED_PACKAGE_PATH: ${{ inputs.package_path }}
      - name: Refuse token bootstrap in the tag workflow
        if: steps.target.outputs.bootstrap == 'true'
        run: |
          echo 'Run stage-bootstrap.yml on main for initial staging.' >&2
          exit 1
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:pack
      - name: Check the selected workspace tarball
        run: npm pack --workspace "${PACKAGE_PATH}" --ignore-scripts --dry-run
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}

  publish-oidc:
    needs: validate
    if: ${{ !inputs.dry_run && needs.validate.outputs.bootstrap != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish-package-${{ needs.validate.outputs.component }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v6.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: git fetch origin main
      - run: node scripts/release.ts
        env:
          EXPECTED_PACKAGE_PATH: ${{ needs.validate.outputs.package_path }}
      - run: npm ci --ignore-scripts
      - name: Publish only the selected package with OIDC and provenance
        run: >-
          npm publish --workspace "${PACKAGE_PATH}"
          --ignore-scripts --access public --provenance
        env:
          PACKAGE_PATH: ${{ needs.validate.outputs.package_path }}
