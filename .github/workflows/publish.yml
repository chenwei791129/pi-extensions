name: Publish package

on:
  push:
    tags: ['*-v*']
  workflow_dispatch: # Release Please dispatches this workflow at each tag

permissions:
  contents: read

concurrency:
  group: publish-ref-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      package_path: ${{ steps.target.outputs.package_path }}
      component: ${{ steps.target.outputs.component }}
      bootstrap: ${{ steps.target.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v6.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: git fetch origin main
      - run: node scripts/release.ts
        id: target
        env:
          NPM_BOOTSTRAP_ENABLED: ${{ vars.NPM_BOOTSTRAP_ENABLED }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:pack
      - name: Check the selected workspace tarball
        run: npm pack --workspace "${PACKAGE_PATH}" --ignore-scripts --dry-run
        env:
          PACKAGE_PATH: ${{ steps.target.outputs.package_path }}

  publish-oidc:
    needs: validate
    if: needs.validate.outputs.bootstrap != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish-package-${{ needs.validate.outputs.component }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v6.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: git fetch origin main
      - run: node scripts/release.ts
        env:
          EXPECTED_PACKAGE_PATH: ${{ needs.validate.outputs.package_path }}
      - run: npm ci --ignore-scripts
      - name: Publish only the selected package with OIDC and provenance
        run: >-
          npm publish --workspace "${PACKAGE_PATH}"
          --ignore-scripts --access public --provenance
        env:
          PACKAGE_PATH: ${{ needs.validate.outputs.package_path }}

  publish-bootstrap:
    needs: validate
    if: needs.validate.outputs.bootstrap == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish-package-${{ needs.validate.outputs.component }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # provenance; token is scoped to the publish step only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v6.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: git fetch origin main
      - run: node scripts/release.ts
        env:
          NPM_BOOTSTRAP_ENABLED: 'true'
          EXPECTED_PACKAGE_PATH: ${{ needs.validate.outputs.package_path }}
      - run: npm ci --ignore-scripts
      - name: Publish first pi-local-settings version with temporary token
        run: >-
          npm publish --workspace "${PACKAGE_PATH}"
          --ignore-scripts --access public --provenance
        env:
          PACKAGE_PATH: ${{ needs.validate.outputs.package_path }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
